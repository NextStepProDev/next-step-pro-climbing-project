# Backend dependency versions — one place, and one GitHub can read.
#
# ⚠️ This file exists for a reason other than tidiness. Versions used to sit in
# gradle.properties and reached build.gradle through "${springdocVersion}". GitHub's
# dependency graph parser cannot resolve such a variable, so it saw **zero** Java
# dependencies in this repo (352 npm packages, 12 actions, 0 maven). The effect was double
# and silent: Dependabot never proposed a single backend update, and security alerts for
# Spring Boot or jjwt had no way to reach us — for GitHub those libraries did not exist.
# No PRs looks exactly the same as "everything up to date".
#
# Dependabot supports the Gradle version catalog format directly, so versions are still in
# one file and the tools can see them. Do not go back to "${...}" in build.gradle.
[versions]
spring-boot = "4.1.2"
dependency-management = "1.1.7"
jspecify = "1.0.1"
springdoc = "3.2.0"
jjwt = "0.13.0"
testcontainers = "1.21.4"
thumbnailator = "0.4.21"
# Not a dependency, just the tool version for the jacoco plugin — hence read through libs.versions.
jacoco = "0.8.15"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
thumbnailator = { module = "net.coobird:thumbnailator", version.ref = "thumbnailator" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
