spring:
  mail:
    host: localhost
    port: 3025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Uploads go to a scratch directory rather than ./uploads, so a test run never leaves files in
# the working tree and parallel runs cannot collide with a developer's local storage.
app:
  storage:
    root: ${java.io.tmpdir}/nsp-climbing-test-uploads

management:
  health:
    mail:
      enabled: false

logging:
  level:
    org.flywaydb: DEBUG
