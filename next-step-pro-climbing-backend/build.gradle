plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.dependency.management)
    id 'jacoco'
}

group = 'pl.nextsteppro'
version = (() -> {
    def versionFile = file("../VERSION")
    if (versionFile.exists()) {
        return versionFile.text.trim()
    }
    return System.getenv("APP_VERSION") ?: "dev"
})()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// ⚠️ Nadpisanie wersji zarządzanej przez BOM Spring Boota, nie kaprys.
//
// Trivy skanuje app.jar przy każdym buildzie i zgłaszał na tomcat-embed-core 11.0.22 trzy
// podatności CRITICAL (CVE-2026-65182, -65905, -68525), załatane dopiero w 11.0.25. Spring Boot
// 4.1.1 podnosi Tomcata tylko do 11.0.24, więc sam bump Boota ich NIE zamyka — trzeba powiedzieć
// to wprost. Postgres nie potrzebuje nadpisania: 4.1.1 daje 42.7.13, a łatka na CVE-2026-54291
// jest w 42.7.12.
//
// Ta linia znika, gdy Spring Boot zacznie zarządzać 11.0.25 lub nowszym — wtedy zostawienie jej
// przypina Was do starszej wersji, niż niesie BOM. Sprawdzać przy każdym bumpie Boota:
// spring-boot-dependencies-<wersja>.pom, klucz <tomcat.version>.
ext['tomcat.version'] = '11.0.25'

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Caching
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Null Safety
    implementation libs.jspecify

    // API Documentation (Swagger/OpenAPI)
    implementation libs.springdoc.openapi

    // Image optimization
    implementation libs.thumbnailator

    // JWT (JSON Web Tokens)
    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    // Dev Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.junit
}

tasks.named('bootRun') {
    doFirst {
        def envFile = file('.env')
        if (envFile.exists()) {
            envFile.readLines().each { line ->
                def trimmed = line.trim()
                if (trimmed && !trimmed.startsWith('#')) {
                    def parts = trimmed.split('=', 2)
                    if (parts.length == 2) {
                        environment parts[0].trim(), parts[1].trim()
                    }
                }
            }
        }
    }
}

tasks.named('processResources') {
    filesMatching('application*.yml') {
        filter { line ->
            line.replace('@version@', project.version.toString())
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        html.required = true
    }
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
}
