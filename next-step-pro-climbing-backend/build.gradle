plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.dependency.management)
    id 'jacoco'
}

group = 'pl.nextsteppro'
version = (() -> {
    def versionFile = file("../VERSION")
    if (versionFile.exists()) {
        return versionFile.text.trim()
    }
    return System.getenv("APP_VERSION") ?: "dev"
})()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// ⚠️ Overriding a version managed by the Spring Boot BOM, not a whim.
//
// Trivy scans app.jar on every build and reported three CRITICAL vulnerabilities in
// tomcat-embed-core 11.0.22 (CVE-2026-65182, -65905, -68525), patched only in 11.0.25. Spring
// Boot 4.1.1 raises Tomcat only to 11.0.24, so bumping Boot alone does NOT close them — it has
// to be said explicitly. Postgres needs no override: 4.1.1 brings 42.7.13, and the patch for
// CVE-2026-54291 is in 42.7.12.
//
// This line goes once Spring Boot manages 11.0.25 or newer — left in, it would then pin us to
// an older version than the BOM brings. Check on every Boot bump:
// spring-boot-dependencies-<version>.pom, key <tomcat.version>.
ext['tomcat.version'] = '11.0.25'

// Jackson, for the same reason and in the same way. Spring Boot 4.1.1 manages 3.1.5 (tools.jackson)
// and 2.21.5 (com.fasterxml, pulled in by third-party libraries), and three jackson-databind
// advisories — including a DoS when parsing Duration/XMLGregorianCalendar — are patched in 3.1.6 and 2.21.6.
// ⚠️ Dependabot CANNOT do this by itself: a security update for a BOM-managed dependency fails
// red without a PR ("Dependabot encountered 1 error"), because there is nothing to bump in any file.
// The red "Dependabot Updates" jobs for jackson-databind are exactly this case.
//
// Goes once the Boot BOM brings jackson-bom ≥ 3.1.6 and jackson-2-bom ≥ 2.21.6 (keys in the same pom).
ext['jackson-bom.version'] = '3.1.7'
ext['jackson-2-bom.version'] = '2.21.7'

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Caching
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Null Safety
    implementation libs.jspecify

    // API Documentation (Swagger/OpenAPI)
    implementation libs.springdoc.openapi

    // Image optimization
    implementation libs.thumbnailator

    // JWT (JSON Web Tokens)
    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    // Dev Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.junit
}

tasks.named('bootRun') {
    doFirst {
        def envFile = file('.env')
        if (envFile.exists()) {
            envFile.readLines().each { line ->
                def trimmed = line.trim()
                if (trimmed && !trimmed.startsWith('#')) {
                    def parts = trimmed.split('=', 2)
                    if (parts.length == 2) {
                        environment parts[0].trim(), parts[1].trim()
                    }
                }
            }
        }
    }
}

tasks.named('processResources') {
    // ⚠️ Without this line a VERSION bump renames the jar but does NOT change the version inside.
    // `project.version` is read in the configuration phase, and `filter` is a closure — Gradle
    // does not see that value as a task input, so after a change to ../VERSION alone
    // processResources stays UP-TO-DATE and `application.yml` in build/resources/main carries
    // the PREVIOUS number. The symptom is silent and misleading: the file is called
    // climbing-backend-4.50.1.jar (the name comes from project.version, not from resources),
    // while `app.version` inside says 4.49.0 — so Swagger and every other reader of that
    // property lie about the version you are running.
    // It was invisible until now because the image was built from scratch in a fresh
    // container, where nothing counts as up to date. Since the jar built in the CI job is what
    // goes to production, this trap is on the release path.
    inputs.property('appVersion', project.version.toString())
    filesMatching('application*.yml') {
        filter { line ->
            line.replace('@version@', project.version.toString())
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // CommentLanguageTest also reads the workflows and the hub. Gradle only tracks this module, so
    // without these inputs a comment changed there leaves `test` UP-TO-DATE and the gate never runs.
    inputs.files(
        fileTree('../.github'),
        fileTree('../next-step-pro-climbing-hub') { exclude '**/.env', '**/*.log' }
    ).withPropertyName('commentLanguageSources').withPathSensitivity(PathSensitivity.RELATIVE)
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        html.required = true
    }
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
}
