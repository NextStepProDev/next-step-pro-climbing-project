services:
  postgres:
    image: postgres:18-alpine
    container_name: nsp-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextsteppro}
      POSTGRES_USER: ${POSTGRES_USER:-nextsteppro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextsteppro_dev}
    ports:
      - "5432:5432"
    volumes:
      # ⚠️ PATH AND NAME CHANGED TOGETHER WITH IMAGE 18 — one without the other loses data.
      # The postgres:18 image moved PGDATA to /var/lib/postgresql/18/docker, and the declared
      # VOLUME from /var/lib/postgresql/data to /var/lib/postgresql. A volume mounted at the
      # old path is therefore no longer the data directory: the container COMES UP, initdb
      # creates an empty cluster next to it, Flyway runs the migrations from zero and the
      # application answers 200 on an empty database — a failure that looks like health. The
      # new volume name is deliberate: postgres_data_dev with the old 17 cluster stays
      # untouched and IS the rollback plan.
      - postgres_data_dev_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextsteppro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nsp-mailhog-dev
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  postgres_data_dev_pg18:
