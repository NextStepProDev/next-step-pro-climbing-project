services:
  postgres:
    image: postgres:18-alpine
    container_name: nsp-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextsteppro}
      POSTGRES_USER: ${POSTGRES_USER:-nextsteppro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextsteppro_dev}
    ports:
      - "5432:5432"
    volumes:
      # ⚠️ ŚCIEŻKA I NAZWA ZMIENIONE RAZEM Z OBRAZEM 18 — jedno bez drugiego traci dane.
      # Obraz postgres:18 przeniósł PGDATA na /var/lib/postgresql/18/docker, a deklarowany
      # VOLUME z /var/lib/postgresql/data na /var/lib/postgresql. Wolumen zamontowany pod
      # starą ścieżką nie jest więc już katalogiem danych: kontener WSTAJE, initdb tworzy
      # pusty klaster obok, Flyway przelatuje migracje od zera i aplikacja odpowiada 200 na
      # pustej bazie — awaria wyglądająca na zdrowie. Nowa nazwa wolumenu jest celowa:
      # postgres_data_dev ze starym klastrem 17 zostaje nietknięty i JEST planem wycofania.
      - postgres_data_dev_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextsteppro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nsp-mailhog-dev
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  postgres_data_dev_pg18:
