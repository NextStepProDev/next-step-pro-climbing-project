services:
  postgres:
    image: postgres:18-alpine
    container_name: nsp-postgres-prod
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "checkpoint_completion_target=0.9"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # ⚠️ PATH AND NAME CHANGED TOGETHER WITH IMAGE 18 — one without the other loses data.
      # The postgres:18 image moved PGDATA to /var/lib/postgresql/18/docker, and the declared
      # VOLUME from /var/lib/postgresql/data to /var/lib/postgresql. A volume mounted at the
      # old path is therefore no longer the data directory: the container COMES UP, initdb
      # creates an empty cluster next to it, Flyway runs the migrations from zero and the
      # application answers 200 on an empty database — a failure that looks like health. The
      # new volume name is deliberate: the old postgres_data_prod stayed alongside as the
      # rollback plan.
      # ⚠️ That volume is NO LONGER ON PRODUCTION (checked 2026-09-12: `docker volume ls`
      # knows only *_pg18 and uploads). The only rollback today is the dump taken before the
      # migration, in /backups/milestones — and that directory is pruned after 90 days
      # (nsp-backup.sh); after that there is no way back to 17 at all. Do not write about the
      # 17 volume here again: for the next major the rollback plan has to be SET UP from
      # scratch, not inherited from this comment.
      - postgres_data_prod_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No process in a container may gain privileges it did not start with (setuid binaries,
    # file capabilities) — a cheap belt in case one is taken over (audit, 2026-10-26). Postgres
    # and nginx start as root and drop to their own users, which this allows; checked on every
    # image before adding.
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    image: ghcr.io/${GHCR_OWNER}/nextsteppro-backend:${VERSION:-latest}
    container_name: nsp-backend-prod
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    volumes:
      - uploads_data_prod:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_AUTH: "true"
      MAIL_STARTTLS: "true"
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_GOOGLE_CLIENT_ID}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_GOOGLE_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-${MAIL_USERNAME}}
      MAIL_USERNAME: ${MAIL_USERNAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: https://nextsteppro.pl,https://www.nextsteppro.pl
      APP_BASE_URL: https://nextsteppro.pl
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    image: ghcr.io/${GHCR_OWNER}/nextsteppro-frontend:${VERSION:-latest}
    container_name: nsp-frontend-prod
    depends_on:
      - backend
    networks:
      - default
      - npm_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data_prod_pg18:
  uploads_data_prod:

networks:
  npm_network:
    external: true
    name: first-aid-kit_default
