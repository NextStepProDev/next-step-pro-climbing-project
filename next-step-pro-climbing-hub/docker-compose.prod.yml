services:
  postgres:
    image: postgres:18-alpine
    container_name: nsp-postgres-prod
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "checkpoint_completion_target=0.9"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # ⚠️ ŚCIEŻKA I NAZWA ZMIENIONE RAZEM Z OBRAZEM 18 — jedno bez drugiego traci dane.
      # Obraz postgres:18 przeniósł PGDATA na /var/lib/postgresql/18/docker, a deklarowany
      # VOLUME z /var/lib/postgresql/data na /var/lib/postgresql. Wolumen zamontowany pod
      # starą ścieżką nie jest więc już katalogiem danych: kontener WSTAJE, initdb tworzy
      # pusty klaster obok, Flyway przelatuje migracje od zera i aplikacja odpowiada 200 na
      # pustej bazie — awaria wyglądająca na zdrowie. Nowa nazwa wolumenu jest celowa:
      # postgres_data_prod ze starym klastrem 17 zostaje nietknięty i JEST planem wycofania.
      - postgres_data_prod_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    image: ghcr.io/${GHCR_OWNER}/nextsteppro-backend:${VERSION:-latest}
    container_name: nsp-backend-prod
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    volumes:
      - uploads_data_prod:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_AUTH: "true"
      MAIL_STARTTLS: "true"
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_GOOGLE_CLIENT_ID}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_GOOGLE_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-${MAIL_USERNAME}}
      MAIL_USERNAME: ${MAIL_USERNAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: https://nextsteppro.pl,https://www.nextsteppro.pl
      APP_BASE_URL: https://nextsteppro.pl
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    image: ghcr.io/${GHCR_OWNER}/nextsteppro-frontend:${VERSION:-latest}
    container_name: nsp-frontend-prod
    depends_on:
      - backend
    networks:
      - default
      - npm_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data_prod_pg18:
  uploads_data_prod:

networks:
  npm_network:
    external: true
    name: first-aid-kit_default
