version: 2
# Miesięczny rytm + mocne grupowanie, żeby pierwszy run nie zasypał lawiną PR-ów.
# Drobne (minor/patch) lecą zgrupowane w jeden PR na ekosystem; majory osobno,
# żeby dało się odrzucić te niekompatybilne (np. przypięte przez framework).
updates:
  # Frontend (npm)
  - package-ecosystem: npm
    directory: /next-step-pro-climbing-frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Backend (Java / Gradle)
  - package-ecosystem: gradle
    directory: /next-step-pro-climbing-backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Akcje GitHub w workflowach CI/CD
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  # Obrazy bazowe w Dockerfile'ach
  - package-ecosystem: docker
    directory: /next-step-pro-climbing-frontend
    schedule:
      interval: monthly
    # ⚠️ Patches arrive on their own: the Dockerfile says `node:24-alpine`, a floating tag that
    # resolves to the newest 24.x at build time, so there is nothing here to raise for them.
    # The only PR this would ever open is a jump to the next major — and node's odd majors (25, 27)
    # NEVER become LTS and die in about seven months, so merging one on the strength of a bigger
    # number would quietly move the build onto a proving ground. Changing lines stays a decision.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /next-step-pro-climbing-backend
    schedule:
      interval: monthly
    # ⚠️ Major obrazu JDK to zmiana skoordynowana, nie podbitka tagu: build.gradle ma
    # `toolchain { languageVersion = 25 }`, więc obraz z samym JDK 26 zostawia Gradle'a szukającego
    # dwudziestki piątki, której tam nie ma. Obie liczby zmienia się razem albo wcale.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  # ⚠️ Compose produkcyjny, a nie kolejny Dockerfile — i dlatego ekosystem jest inny.
  # Stoi tu postgres:17-alpine, czyli baza z danymi klientów, i do tej pory nie pilnował jej
  # nikt: dependabot.yml wymieniał wyłącznie dwa katalogi z Dockerfile'ami.
  # ⚠️ MUSI być `docker-compose`, nie `docker`. Ten drugi szuka wyłącznie Dockerfile'ów i na
  # katalogu z samym compose przerywa zadanie błędem "No Dockerfiles" — czyli nie tylko nie
  # pilnuje tych obrazów, ale wywala cały przebieg Dependabota dla tego wpisu.
  - package-ecosystem: docker-compose
    directory: /next-step-pro-climbing-hub
    schedule:
      interval: monthly
    # ⚠️ Major Postgresa NIE jest podbitką tagu — to migracja danych, i ta blokada powstała po
    # tym, jak 17 → 18 wjechało tu jako zwykły PR i zostało zmergowane. Katalog danych z jednego
    # majora nie startuje pod następnym, a w 18 doszła zmiana ścieżki PGDATA, przez którą kontener
    # wstaje na PUSTEJ bazie zamiast odmówić. Procedura przejścia: hub/RESTORE.md (zrzut + odtworzenie).
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
