version: 2
# Monthly rhythm + strong grouping, so the first run does not bury us in an avalanche of PRs.
# Small ones (minor/patch) go grouped into one PR per ecosystem; majors separately,
# so the incompatible ones (e.g. pinned by a framework) can be rejected.
updates:
  # Frontend (npm)
  - package-ecosystem: npm
    directory: /next-step-pro-climbing-frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Backend (Java / Gradle)
  - package-ecosystem: gradle
    directory: /next-step-pro-climbing-backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions in the CI/CD workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images in the Dockerfiles
  - package-ecosystem: docker
    directory: /next-step-pro-climbing-frontend
    schedule:
      interval: monthly
    # ⚠️ The image is `nginx:alpine` and no longer contains node — the node version lives in
    # .nvmrc (see ci-frontend.yml). This ignore stays as a guard should a node stage ever return:
    # node's odd majors (25, 27) NEVER become LTS and die in about seven months, so merging one
    # on the strength of a bigger number would quietly move the build onto a proving ground.
    # Changing lines stays a decision.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /next-step-pro-climbing-backend
    schedule:
      interval: monthly
    # ⚠️ A JDK image major is a coordinated change, not a tag bump: build.gradle has
    # `toolchain { languageVersion = 25 }`, so an image with only JDK 26 leaves Gradle looking
    # for a 25 that is not there. Both numbers change together or not at all.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  # ⚠️ The production compose file, not another Dockerfile — hence a different ecosystem.
  # postgres:18-alpine lives here, i.e. the database with client data, and until now nobody
  # watched it: dependabot.yml listed only the two directories with Dockerfiles.
  # ⚠️ It MUST be `docker-compose`, not `docker`. The latter looks only for Dockerfiles and on
  # a directory with compose alone aborts with "No Dockerfiles" — so it not only fails to
  # watch these images, it breaks the whole Dependabot run for this entry.
  - package-ecosystem: docker-compose
    directory: /next-step-pro-climbing-hub
    schedule:
      interval: monthly
    # ⚠️ A Postgres major is NOT a tag bump — it is a data migration, and this block exists
    # because 17 → 18 came in here as an ordinary PR and got merged. A data directory from one
    # major does not start under the next, and 18 also moved PGDATA, so the container comes up
    # on an EMPTY database instead of refusing. Procedure: hub/RESTORE.md (dump + restore).
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
