version: 2
# Miesięczny rytm + mocne grupowanie, żeby pierwszy run nie zasypał lawiną PR-ów.
# Drobne (minor/patch) lecą zgrupowane w jeden PR na ekosystem; majory osobno,
# żeby dało się odrzucić te niekompatybilne (np. przypięte przez framework).
updates:
  # Frontend (npm)
  - package-ecosystem: npm
    directory: /next-step-pro-climbing-frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Backend (Java / Gradle)
  - package-ecosystem: gradle
    directory: /next-step-pro-climbing-backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Akcje GitHub w workflowach CI/CD
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  # Obrazy bazowe w Dockerfile'ach
  - package-ecosystem: docker
    directory: /next-step-pro-climbing-frontend
    schedule:
      interval: monthly
    # ⚠️ Patches arrive on their own: the Dockerfile says `node:24-alpine`, a floating tag that
    # resolves to the newest 24.x at build time, so there is nothing here to raise for them.
    # The only PR this would ever open is a jump to the next major — and node's odd majors (25, 27)
    # NEVER become LTS and die in about seven months, so merging one on the strength of a bigger
    # number would quietly move the build onto a proving ground. Changing lines stays a decision.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /next-step-pro-climbing-backend
    schedule:
      interval: monthly
