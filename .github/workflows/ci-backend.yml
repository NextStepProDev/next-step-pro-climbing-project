name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - next-step-pro-climbing-backend/**
      - VERSION
  pull_request:
    branches: [main]
    paths:
      - next-step-pro-climbing-backend/**
      - VERSION

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    defaults:
      run:
        working-directory: next-step-pro-climbing-backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew classes

      - run: ./gradlew test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: next-step-pro-climbing-backend/build/reports/tests/
          retention-days: 7

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextsteppro-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: next-step-pro-climbing-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skan CVE w warstwie systemowej obrazu (czego gradle dependency-check nie widzi).
      # Informacyjnie na razie (exit-code 0 = nie blokuje deployu). ignore-unfixed
      # ucina szum z podatności bez łatki; zostają te naprawialne bumpem bazy.
      # Gdy wyniki będą czyste, ustaw exit-code na 1, by high/critical wywalały build.
      # Skanuje manifest amd64 (warstwa OS wspólna dla obu arch).
      - name: Trivy image scan (high+)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Nazwa obrazu musi być lowercase (owner NextStepProDev ma wielkie litery,
          # a OCI reference wymaga małych — metadata-action lowercase'uje sam przy pushu).
          image-ref: ghcr.io/nextstepprodev/nextsteppro-backend:${{ steps.version.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
