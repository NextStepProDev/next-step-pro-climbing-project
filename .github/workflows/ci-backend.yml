name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - next-step-pro-climbing-backend/**
      - VERSION
      # The workflow file itself: without this a PR that only touches CI never runs CI,
      # so the artifact plumbing below would merge having never been exercised.
      # dependency-graph.yml already does this.
      - .github/workflows/ci-backend.yml
  pull_request:
    branches: [main]
    paths:
      - next-step-pro-climbing-backend/**
      - VERSION
      # The workflow file itself: without this a PR that only touches CI never runs CI,
      # so the artifact plumbing below would merge having never been exercised.
      # dependency-graph.yml already does this.
      - .github/workflows/ci-backend.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default (audit, 2026-10-26): the test job runs code from pull requests and has
# no business with the registry or the Security tab. The docker job below gets what it needs.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    defaults:
      run:
        working-directory: next-step-pro-climbing-backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: ./gradlew classes

      - run: ./gradlew test

      # Package the jar HERE, from the tree that just passed the suite, and hand it to the docker
      # job. The image used to run `bootJar -x test` itself, so what shipped was a second
      # compilation nothing had run; this closes that gap and drops ~12 minutes of QEMU-emulated
      # Gradle from the docker job at the same time. Deliberately not gated on push: on a PR it
      # costs seconds against a warm cache and catches a packaging failure before merge.
      - name: Package the tested jar
        run: |
          ./gradlew bootJar
          # Pin the name instead of globbing. bootJar leaves climbing-backend-<VERSION>.jar, but
          # the `jar` task would drop a -plain.jar beside it and the old `COPY *.jar` said nothing
          # about which one it meant. Fail loudly here rather than ship the wrong one.
          test "$(ls build/libs/*.jar | wc -l)" -eq 1
          mkdir -p build/artifact
          cp build/libs/*.jar build/artifact/app.jar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: backend-jar
          path: next-step-pro-climbing-backend/build/artifact/app.jar
          # ⚠️ 7, not 1. The docker job no longer builds anything — it DOWNLOADS this — so the
          # retention window is now how long "Re-run failed jobs" keeps working. At 1 day a
          # re-run two days later fails with "artifact not found", which names neither the cause
          # nor the fix, and that affordance worked unconditionally before the handoff existed.
          # Storage is free on a public repo, so the short window bought nothing.
          retention-days: 7
          # Default is `warn`, which would upload nothing and let the docker job fail later
          # with "artifact not found" — a failure two jobs away from its cause.
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: next-step-pro-climbing-backend/build/reports/tests/
          retention-days: 7

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Pozwala wgrać wynik skanu do zakładki Security. Bez tego upload-sarif
      # kończy się 403, a skan znów jest widoczny wyłącznie w logu.
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version and image owner
        id: version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          # The Trivy steps below used to hardcode the owner in lowercase while metadata-action
          # derived it from github.repository_owner — two sources of truth for one image name,
          # agreeing only by luck. They cannot simply share the context value: GHCR requires a
          # lowercase path and the owner is NextStepProDev, which is why the literal was there.
          # Lowercase it once here instead, so a rename or a fork moves both together.
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The jar the previous job built and tested. The Dockerfile only copies it in.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-jar
          path: next-step-pro-climbing-backend

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextsteppro-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: next-step-pro-climbing-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build-args: the version is already baked into the jar's application.yml by
          # processResources. build.gradle reads ../VERSION first and only falls back to the
          # APP_VERSION env, and ../VERSION does not exist inside the docker context — which is
          # the only reason that build-arg was ever load-bearing.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skan CVE obrazu: warstwa systemowa ORAZ biblioteki w app.jar — Trivy analizuje jary,
      # czego gradle dependency-check tu nie robi. ignore-unfixed ucina szum z podatności bez
      # łatki; zostają te naprawialne bumpem. Skanuje manifest amd64 (warstwa OS wspólna dla
      # obu architektur).
      # Wynik idzie do zakładki Security, nie tylko do logu. ⚠️ To nie jest kosmetyka:
      # przez cały czas skan zgłaszał podatności app.jar (3× CRITICAL na tomcat-embed-core),
      # ale przy format: table i exit-code: 0 raport oglądał wyłącznie ten, kto otworzył log
      # zakończonego na zielono builda. Czyli nikt. SARIF wgrany tutaj daje alerty w miejscu,
      # do którego GitHub sam kieruje — i działa niezależnie od grafu zależności, który dla
      # Javy w tym repo bywa ślepy.
      - name: Trivy image scan (SARIF do zakładki Security)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.version.outputs.owner }}/nextsteppro-backend:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Ten przebieg tylko raportuje; bramką jest krok poniżej.
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Wgraj wynik do zakładki Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        # Wgraj także wtedy, gdy bramka niżej wywali build — inaczej dokładnie w sytuacji,
        # w której raport jest najbardziej potrzebny, nie ma go nigdzie.
        # ⚠️ ...ale TYLKO gdy plik naprawdę powstał. Samo `always()` obejmuje również przypadek,
        # w którym skan w ogóle nie ruszył, bo padł wcześniejszy krok joba — wtedy ten krok
        # kończy się „Path does not exist: trivy-backend.sarif" i to ON ląduje w adnotacjach
        # przebiegu, PRZYKRYWAJĄC prawdziwą przyczynę. Zdarzyło się na 4.60.0: build obrazu padł
        # na zerwanym połączeniu z auth.docker.io, a jedyny widoczny błąd mówił o brakującym
        # SARIF-ie — czyli kierował szukanie dokładnie tam, gdzie nic nie było zepsute.
        if: always() && hashFiles('trivy-backend.sarif') != ''
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      # Bramka: CRITICAL zatrzymuje build, HIGH tylko raportuje.
      # ⚠️ Próg jest na CRITICAL, a nie na HIGH, i to jest przemyślane: warstwa systemowa alpine
      # ma stale kilka HIGH bez związku z naszym kodem (curl, openssl), więc bramka na HIGH
      # blokowałaby deploy w rytmie wydań Alpine'a i szybko zostałaby wyłączona. CRITICAL jest
      # dziś czyste — po naprawie tomcata app.jar zgłasza zero — więc ta bramka od pierwszego
      # dnia znaczy "coś się właśnie zepsuło", a nie "znowu to samo".
      - name: Bramka CVE (CRITICAL blokuje)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.version.outputs.owner }}/nextsteppro-backend:${{ steps.version.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
