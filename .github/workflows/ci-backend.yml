name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - next-step-pro-climbing-backend/**
      - VERSION
  pull_request:
    branches: [main]
    paths:
      - next-step-pro-climbing-backend/**
      - VERSION

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # Pozwala wgrać wynik skanu do zakładki Security. Bez tego upload-sarif
  # kończy się 403, a skan znów jest widoczny wyłącznie w logu.
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    defaults:
      run:
        working-directory: next-step-pro-climbing-backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew classes

      - run: ./gradlew test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: next-step-pro-climbing-backend/build/reports/tests/
          retention-days: 7

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextsteppro-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: next-step-pro-climbing-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skan CVE obrazu: warstwa systemowa ORAZ biblioteki w app.jar — Trivy analizuje jary,
      # czego gradle dependency-check tu nie robi. ignore-unfixed ucina szum z podatności bez
      # łatki; zostają te naprawialne bumpem. Skanuje manifest amd64 (warstwa OS wspólna dla
      # obu architektur).
      # Wynik idzie do zakładki Security, nie tylko do logu. ⚠️ To nie jest kosmetyka:
      # przez cały czas skan zgłaszał podatności app.jar (3× CRITICAL na tomcat-embed-core),
      # ale przy format: table i exit-code: 0 raport oglądał wyłącznie ten, kto otworzył log
      # zakończonego na zielono builda. Czyli nikt. SARIF wgrany tutaj daje alerty w miejscu,
      # do którego GitHub sam kieruje — i działa niezależnie od grafu zależności, który dla
      # Javy w tym repo bywa ślepy.
      - name: Trivy image scan (SARIF do zakładki Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/nextstepprodev/nextsteppro-backend:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Ten przebieg tylko raportuje; bramką jest krok poniżej.
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Wgraj wynik do zakładki Security
        uses: github/codeql-action/upload-sarif@v3
        # Wgraj także wtedy, gdy bramka niżej wywali build — inaczej dokładnie w sytuacji,
        # w której raport jest najbardziej potrzebny, nie ma go nigdzie.
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      # Bramka: CRITICAL zatrzymuje build, HIGH tylko raportuje.
      # ⚠️ Próg jest na CRITICAL, a nie na HIGH, i to jest przemyślane: warstwa systemowa alpine
      # ma stale kilka HIGH bez związku z naszym kodem (curl, openssl), więc bramka na HIGH
      # blokowałaby deploy w rytmie wydań Alpine'a i szybko zostałaby wyłączona. CRITICAL jest
      # dziś czyste — po naprawie tomcata app.jar zgłasza zero — więc ta bramka od pierwszego
      # dnia znaczy "coś się właśnie zepsuło", a nie "znowu to samo".
      - name: Bramka CVE (CRITICAL blokuje)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/nextstepprodev/nextsteppro-backend:${{ steps.version.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
