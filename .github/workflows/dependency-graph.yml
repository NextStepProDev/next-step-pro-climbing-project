# Wysyła graf zależności backendu do GitHuba, żeby alerty bezpieczeństwa w ogóle miały co
# analizować.
#
# ⚠️ Powód istnienia tego pliku: aktualizacje wersji i alerty CVE to DWA RÓŻNE mechanizmy.
# Updater Dependabota czyta gradle/libs.versions.toml i działa (dowód: pierwsze PR-y backendowe).
# Alerty zasila natomiast graf zależności, budowany osobnym, statycznym parserem — a ten w
# build.gradle nie widzi już nawet współrzędnych, bo po przejściu na katalog wersji stoi tam
# `implementation libs.springdoc.openapi`. Efekt: graf raportował npm 352, githubactions 13
# i maven **0**, czyli dla GitHuba backend nie miał ani jednej zależności i żadne CVE nie miało
# jak do nas trafić. Trzy krytyczne podatności w tomcat-embed-core wisiały tygodniami i wyszły
# dopiero ze skanu obrazu.
#
# Ta akcja nie parsuje plików — URUCHAMIA Gradle'a i wysyła graf, który on sam rozwiązał. Dlatego
# obejmuje też zależności zarządzane przez BOM Spring Boota (tomcat-embed-core, sterownik
# Postgresa, Hibernate), których żadna analiza statyczna build.gradle nie zobaczy, bo nie ma ich
# tam wypisanych.
name: Dependency Graph

on:
  push:
    branches: [main]
    paths:
      - next-step-pro-climbing-backend/**
      - .github/workflows/dependency-graph.yml

# Wymagane przez API grafu zależności: akcja zapisuje snapshot do repozytorium.
permissions:
  contents: write

jobs:
  submit:
    name: Zgłoś graf zależności backendu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          # Ta sama wersja co toolchain w build.gradle — inaczej Gradle szuka JDK, którego tu nie ma.
          java-version: 25

      - uses: gradle/actions/dependency-submission@v6
        with:
          # Projekt Gradle'a nie leży w korzeniu repozytorium.
          build-root-directory: next-step-pro-climbing-backend
