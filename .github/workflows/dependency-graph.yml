# Sends the backend's dependency graph to GitHub, so that security alerts have anything to
# analyse at all.
#
# ⚠️ Why this file exists: version updates and CVE alerts are TWO DIFFERENT mechanisms.
# Dependabot's updater reads gradle/libs.versions.toml and works (proof: the first backend PRs).
# Alerts, however, are fed by the dependency graph, built by a separate static parser — and in
# build.gradle it no longer sees even the coordinates, because after the move to the version
# catalog it says `implementation libs.springdoc.openapi`. Result: the graph reported npm 352,
# githubactions 13 and maven **0**, i.e. for GitHub the backend had not a single dependency and
# no CVE could ever reach us. Three critical vulnerabilities in tomcat-embed-core hung around
# for weeks and only surfaced from the image scan.
#
# This action does not parse files — it RUNS Gradle and sends the graph Gradle itself resolved.
# So it also covers dependencies managed by the Spring Boot BOM (tomcat-embed-core, the Postgres
# driver, Hibernate), which no static analysis of build.gradle will see, because they are not
# listed there.
name: Dependency Graph

on:
  push:
    branches: [main]
    paths:
      - next-step-pro-climbing-backend/**
      - .github/workflows/dependency-graph.yml

# Required by the dependency graph API: the action writes a snapshot to the repository.
permissions:
  contents: write

jobs:
  submit:
    name: Submit the backend dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # The same version as the toolchain in build.gradle — otherwise Gradle looks for a JDK that is not here.
          java-version: 25

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The Gradle project is not at the repository root.
          build-root-directory: next-step-pro-climbing-backend
          # ⚠️ Without this the graph also describes the libraries Gradle PLUGINS use while
          # building — and those reach neither the jar nor the server. The first run reported
          # commons-lang3 3.16.0 from the plugin classpath this way (the application uses 3.20.0,
          # newer than the patch) and raised an alert about something that never leaves the CI
          # runner. Dependabot then tried to open a fix PR, found the library in no file to edit
          # and failed the run with `security_update_dependency_not_found`.
          #
          # An alert about a build tool is noise, and noise kills alerts — the same principle
          # that makes the Trivy gate block CRITICAL, not HIGH. It does not weaken the plugins'
          # own versions: the `gradle` ecosystem watches them, as they sit in gradle/libs.versions.toml.
          dependency-graph-exclude-configurations: classpath
