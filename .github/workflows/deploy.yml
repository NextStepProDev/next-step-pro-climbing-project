name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        # ⚠️ No default, and that is the whole point. This used to default to `main`, which made
        # the fallback below unreachable: the input was never empty, so `cat VERSION` was computed
        # and thrown away on every run, and every deploy shipped the floating `main` tag while the
        # log said so in a way nobody read. Leave the field empty for the normal case.
        #
        # The cost of pinning, so nobody is surprised by it: a deploy clicked before the docker
        # job has finished now FAILS at `compose pull`, because that version tag does not exist
        # yet. Under `main` the same click quietly deployed the PREVIOUS build and stayed green
        # through the healthcheck and the smoke tests. Loud beats silent; wait for CI and retry.
        description: Image tag to deploy. Leave EMPTY to deploy the version in the VERSION file; fill in only to roll back or to pin a build (e.g. 4.49.0, sha-abc1234).
        required: false
        default: ''

# The job token reads the repository and nothing else (audit, 2026-10-26): the server pulls
# the images itself, and a workflow with no `permissions` gets whatever the repository
# default allows.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read VERSION file
        id: version
        # Through the environment, not `${{ }}` in the script: an expression is pasted into the
        # shell before it runs, so a quote or `$(…)` typed in the field would run as code — here
        # and, through the output, in the script on the server. The tag pattern below stops it.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          else
            VERSION="main"
          fi
          # Use input version if provided, otherwise use VERSION file. This branch was dead until
          # the input lost its `main` default — see the note on the input above.
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "ERROR: not an image tag: letters, digits, dot, dash, underscore only." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"
          # Deploying the floating tag is still allowed - it is the honest answer when you want
          # whatever is newest - but it costs traceability, so name that here instead of letting
          # the box report a branch name where a version belongs.
          if [ "$VERSION" = "main" ]; then
            echo "NOTE: deploying the floating 'main' tag - docker inspect will report ':main', not a version."
          fi

      - name: Encode docker-compose.prod.yml
        id: compose
        run: echo "content=$(base64 -w 0 next-step-pro-climbing-hub/docker-compose.prod.yml)" >> "$GITHUB_OUTPUT"

      - name: Encode setup-swap.sh
        id: swap
        run: echo "content=$(base64 -w 0 next-step-pro-climbing-hub/setup-swap.sh)" >> "$GITHUB_OUTPUT"

      - name: Encode nsp-backup.sh
        id: backup
        run: echo "content=$(base64 -w 0 next-step-pro-climbing-hub/nsp-backup.sh)" >> "$GITHUB_OUTPUT"

      - name: Encode nsp-backup logrotate config
        id: backuprotate
        run: echo "content=$(base64 -w 0 next-step-pro-climbing-hub/nsp-backup.logrotate)" >> "$GITHUB_OUTPUT"

      - name: Deploy to production VM
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          COMPOSE_B64: ${{ steps.compose.outputs.content }}
          SWAP_B64: ${{ steps.swap.outputs.content }}
          BACKUP_B64: ${{ steps.backup.outputs.content }}
          BACKUP_ROTATE_B64: ${{ steps.backuprotate.outputs.content }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: COMPOSE_B64,SWAP_B64,BACKUP_B64,BACKUP_ROTATE_B64
          script: |
            echo "$COMPOSE_B64" | base64 -d > ${{ secrets.DEPLOY_PATH }}/docker-compose.prod.yml
            # Ensure swap exists before starting memory-hungry containers (idempotent).
            echo "$SWAP_B64" | base64 -d > ${{ secrets.DEPLOY_PATH }}/setup-swap.sh
            sudo -n bash ${{ secrets.DEPLOY_PATH }}/setup-swap.sh || echo "WARN: swap setup skipped/failed (check passwordless sudo)"
            # Ship the backup script from the repo on every deploy. Without this the
            # only way it reaches the server is a full re-provision, so the copy that
            # actually runs at 3 AM drifts away from the reviewed one in git — the same
            # trap as docker-compose.prod.yml being edited in place on the box.
            echo "$BACKUP_B64" | base64 -d > ${{ secrets.DEPLOY_PATH }}/nsp-backup.sh
            echo "$BACKUP_ROTATE_B64" | base64 -d > ${{ secrets.DEPLOY_PATH }}/nsp-backup.logrotate
            sudo -n install -m 0755 ${{ secrets.DEPLOY_PATH }}/nsp-backup.sh /usr/local/bin/nsp-backup.sh \
              && sudo -n install -m 0644 ${{ secrets.DEPLOY_PATH }}/nsp-backup.logrotate /etc/logrotate.d/nsp-backup \
              && echo "Backup script + logrotate installed." \
              || echo "WARN: backup script install skipped/failed (check passwordless sudo)"
            cd ${{ secrets.DEPLOY_PATH }}
            export VERSION=${{ steps.version.outputs.version }}
            # Old app images go BEFORE the pull. `compose pull` keeps every tag it ever pulled (by
            # 4.75.5 that was 38 versions per repo, ~22 GB of a 45 GB disk), and a pull stopped by a
            # full disk ends the deploy red before any later cleanup step could run. Keeps whatever
            # a container uses plus the two newest images per repo: today's release and the
            # previous one, the quick rollback; with the new pull that is at most three on disk.
            # Counted by image ID, not by tag: `main` and `4.75.5` can name one image, and counting
            # rows would keep one image and delete the rollback. Scoped to the app images on
            # purpose: postgres is the database and alpine runs nsp-backup.sh. `|| echo`
            # throughout: cleanup must never fail the deploy.
            IN_USE=$(docker ps -aq | xargs -r docker inspect --format '{{.Image}}' | sed 's/^sha256://' | cut -c1-12 | tr '\n' ' ')
            for repo in nextsteppro-backend nextsteppro-frontend; do
              # Sorted by creation date here, not trusted from `docker images`: this box runs the
              # containerd image store, which promises no order, and an unsorted list would rank the
              # newest image third and delete it. <none> rows are dropped BEFORE the ranking, not
              # after: an untagged image (the previous `main` once a second `main` deploy takes its
              # tag) would otherwise fill one of the two places, the prune below would delete it
              # anyway, and only the running image would be left, without a rollback. Every tag of
              # the third and older distinct tagged image goes unless a container holds it.
              docker images --filter "reference=ghcr.io/*/${repo}" --format '{{.CreatedAt}}\t{{.ID}} {{.Repository}}:{{.Tag}}' \
                | sort -r | cut -f2 \
                | awk -v used="$IN_USE" '
                    BEGIN { n = split(used, u, " "); for (i = 1; i <= n; i++) inuse[u[i]] = 1 }
                    $2 ~ /:<none>$/ { next }
                    !($1 in rank) { rank[$1] = ++k }
                    rank[$1] > 2 && !($1 in inuse) { print $2 }' \
                | xargs -r docker rmi || echo "WARN: could not remove some ${repo} images"
            done
            docker image prune -f || echo "WARN: dangling image prune failed"
            df -h / | tail -1
            # `|| exit 1` on these two, and only these: the script has no `set -e` (v1.2.5 of the SSH
            # action has no `script_stop` and runs to the end), so the step reports the LAST
            # command. A failed pull (full disk, missing tag) left the old containers up, the old
            # backend was healthy, and the deploy went green on the old version. Not `set -e` on
            # the whole script: swap, backup install and cleanup are meant to warn, not stop.
            docker compose -f docker-compose.prod.yml pull || exit 1
            docker compose -f docker-compose.prod.yml up -d || exit 1

      - name: Verify deployment health
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Healthy is not enough: the PREVIOUS backend is healthy too, so a release that never
            # replaced it passed this check. Both containers must run the tag just deployed (the
            # version is pattern-checked in "Read VERSION file", so it is safe to paste here).
            VERSION="${{ steps.version.outputs.version }}"
            for c in nsp-backend-prod nsp-frontend-prod; do
              IMAGE=$(docker inspect --format '{{.Config.Image}}' "$c" 2>/dev/null || echo "missing")
              if [ "${IMAGE##*:}" != "$VERSION" ]; then
                echo "ERROR: $c runs '$IMAGE', expected tag '$VERSION'."
                exit 1
              fi
              echo "$c runs $IMAGE"
            done
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 16); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' nsp-backend-prod 2>/dev/null || echo "missing")
              echo "Attempt $i/16: backend health = $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "Deployment verified successfully."
                exit 0
              fi
              sleep 15
            done
            echo "ERROR: Backend did not become healthy within 4 minutes."
            docker logs --tail 80 nsp-backend-prod
            exit 1

      - name: Smoke test public endpoints
        run: |
          BASE="https://nextsteppro.pl"
          MONTH=$(date +%Y-%m)
          # Read-only GETs the live frontend actually uses; covers nginx routing
          # + backend + DB across several modules. Every path here must exist in
          # SiteSettingsController & co. — removing an endpoint means removing it
          # here too, or the deploy goes red on a healthy release.
          PATHS=(
            "/"
            "/api/courses?language=pl"
            "/api/news?page=0&size=3&language=pl"
            "/api/instructors?language=pl"
            "/api/calendar/month/${MONTH}"
            "/api/settings/home"
            "/api/settings/calendar-promo"
          )
          FAILED=0
          for p in "${PATHS[@]}"; do
            CODE="000"
            for attempt in 1 2 3; do
              CODE=$(curl -sS -m 15 -o /dev/null -w "%{http_code}" "${BASE}${p}" || echo "000")
              [ "$CODE" = "200" ] && break
              echo "  ${p} -> HTTP ${CODE} (attempt ${attempt}/3), retrying in 5s..."
              sleep 5
            done
            if [ "$CODE" = "200" ]; then
              echo "OK   HTTP 200  ${p}"
            else
              echo "FAIL HTTP ${CODE}  ${p}"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: one or more public endpoints did not return 200 — deploy is unhealthy."
            exit 1
          fi
          echo "Smoke test passed: all public endpoints return 200."

      - name: SEO smoke test (crawler routing + robots)
        # Read-only GETs with bot user-agents. Guards the silent indexing failures
        # unit tests can't reach: the nginx $is_bot meta-refresh loop and robots.txt
        # blanket-blocks. Blocking — a failure here fails the deploy.
        run: bash next-step-pro-climbing-hub/seo-smoke.sh https://nextsteppro.pl
