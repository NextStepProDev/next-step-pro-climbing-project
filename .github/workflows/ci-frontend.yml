name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - next-step-pro-climbing-frontend/**
      - VERSION
      # The workflow file itself: without this a PR that only touches CI never runs CI,
      # so the artifact plumbing below would merge having never been exercised.
      # dependency-graph.yml already does this.
      - .github/workflows/ci-frontend.yml
  pull_request:
    branches: [main]
    paths:
      - next-step-pro-climbing-frontend/**
      - VERSION
      # The workflow file itself: without this a PR that only touches CI never runs CI,
      # so the artifact plumbing below would merge having never been exercised.
      # dependency-graph.yml already does this.
      - .github/workflows/ci-frontend.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # Pozwala wgrać wynik skanu do zakładki Security. Bez tego upload-sarif
  # kończy się 403, a skan znów jest widoczny wyłącznie w logu.
  security-events: write

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: next-step-pro-climbing-frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The version lives in .nvmrc, which `nvm use` reads too, so this job and a developer's
          # machine cannot drift apart by editing one of two copies of the same number.
          #
          # ⚠️ 24, not the newer 26, and it is the tests that decide: node 26 ships its own global
          # localStorage, which shadows the one jsdom provides, and 32 tests fail on it. This used
          # to be pinned in the Dockerfile too, but the image no longer contains node — this job
          # builds the bundle that ships, so this is now the only place the number matters, and
          # building on a version the suite cannot run on would mean shipping what nothing
          # verified.
          #
          # ⚠️ The blocker is VITEST 4, not node itself, and that distinction decides when this
          # can move. Fire Academy runs the same suite shape on node 26 with no failures because
          # it is on vitest 5 / jsdom 30 — so the trigger to revisit is our own upgrade to vitest
          # 5, not the calendar and not node 26 becoming LTS (2026-10-28). Do not copy a node
          # version between the two repos without checking which vitest each one is on.
          node-version-file: next-step-pro-climbing-frontend/.nvmrc
          cache: npm
          cache-dependency-path: next-step-pro-climbing-frontend/package-lock.json

      - run: npm ci

      # Informacyjnie na razie (nie blokuje deployu). Gdy wyniki będą czyste,
      # usuń continue-on-error, żeby high/critical wywalały build.
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      - run: npm run lint

      - run: npx tsc -b

      - run: npm test

      # Second pass under a negative UTC offset. Every timezone bug the calendar has had was
      # invisible in Poland and total for an athlete abroad (a "next week" arrow that wrote
      # back the date already in the URL, a completion button eight hours off), and a runner
      # in UTC is not far enough west to catch them either.
      - name: Unit tests (America/New_York)
        run: npm run test:tz

      # E2E lived in the repo but ran only when someone remembered to, so it was free to rot.
      # The golden path is deliberately backend-free and playwright.config.ts brings up the dev
      # server itself, so this needs nothing beyond the browser binary.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: next-step-pro-climbing-frontend/test-results/
          retention-days: 7

      - run: npm run build

      # Hand the built bundle to the docker job instead of letting the image rebuild it. Two
      # reasons, correctness first: what ships is then the exact directory this job linted,
      # type-checked and tested, not a second build of the same source that nothing ran. And
      # dist is architecture-independent, so building it once per platform meant Vite running
      # under QEMU to produce identical text files — 11 of the docker job's 13 minutes.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: next-step-pro-climbing-frontend/dist
          # ⚠️ 7, not 1 — see the note in ci-backend.yml. The docker job downloads this instead
          # of building it, so retention is now the lifetime of "Re-run failed jobs".
          retention-days: 7
          # Default is `warn`, which would upload nothing and let the docker job fail later
          # with "artifact not found" — a failure two jobs away from its cause.
          if-no-files-found: error

  docker:
    needs: lint-typecheck-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Read version and image owner
        id: version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          # The Trivy steps below used to hardcode the owner in lowercase while metadata-action
          # derived it from github.repository_owner — two sources of truth for one image name,
          # agreeing only by luck. They cannot simply share the context value: GHCR requires a
          # lowercase path and the owner is NextStepProDev, which is why the literal was there.
          # Lowercase it once here instead, so a rename or a fork moves both together.
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The bundle the previous job built and tested. The Dockerfile only copies it in.
      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: next-step-pro-climbing-frontend/dist

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextsteppro-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: next-step-pro-climbing-frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build-args: the version is baked into the bundle by the job that built it.
          # vite.config.ts reads ../VERSION first and only falls back to VITE_APP_VERSION,
          # and ../VERSION does not exist inside the docker context — which is the only
          # reason that build-arg was ever load-bearing.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skan CVE obrazu — warstwa systemowa nginxa, czego npm audit nie widzi. ignore-unfixed
      # ucina szum z podatności bez łatki; zostają te naprawialne bumpem bazy. Skanuje manifest
      # amd64 (warstwa OS wspólna dla obu architektur).
      # Wynik idzie do zakładki Security, nie tylko do logu. ⚠️ To nie jest kosmetyka:
      # po stronie backendu ten sam skan zgłaszał 3× CRITICAL i nikt tego nie widział, bo przy
      # format: table i exit-code: 0 raport oglądał wyłącznie ten, kto otworzył log builda
      # zakończonego na zielono. Czyli nikt. SARIF wgrany tutaj daje alerty w miejscu, do
      # którego GitHub sam kieruje.
      - name: Trivy image scan (SARIF do zakładki Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.version.outputs.owner }}/nextsteppro-frontend:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Ten przebieg tylko raportuje; bramką jest krok poniżej.
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Wgraj wynik do zakładki Security
        uses: github/codeql-action/upload-sarif@v4
        # Wgraj także wtedy, gdy bramka niżej wywali build — inaczej dokładnie w sytuacji,
        # w której raport jest najbardziej potrzebny, nie ma go nigdzie.
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      # Bramka: CRITICAL zatrzymuje build, HIGH tylko raportuje.
      # ⚠️ Próg jest na CRITICAL, a nie na HIGH, i to jest przemyślane: warstwa systemowa alpine
      # ma stale kilka HIGH bez związku z naszym kodem (curl, openssl), więc bramka na HIGH
      # blokowałaby deploy w rytmie wydań Alpine'a i szybko zostałaby wyłączona. CRITICAL jest
      # dziś czyste — po naprawie tomcata app.jar zgłasza zero — więc ta bramka od pierwszego
      # dnia znaczy "coś się właśnie zepsuło", a nie "znowu to samo".
      - name: Bramka CVE (CRITICAL blokuje)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.version.outputs.owner }}/nextsteppro-frontend:${{ steps.version.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
