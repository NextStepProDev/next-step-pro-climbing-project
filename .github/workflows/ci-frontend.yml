name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - next-step-pro-climbing-frontend/**
      - VERSION
  pull_request:
    branches: [main]
    paths:
      - next-step-pro-climbing-frontend/**
      - VERSION

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # Pozwala wgrać wynik skanu do zakładki Security. Bez tego upload-sarif
  # kończy się 403, a skan znów jest widoczny wyłącznie w logu.
  security-events: write

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: next-step-pro-climbing-frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The version lives in .nvmrc, which `nvm use` reads too, so this job and a developer's
          # machine cannot drift apart by editing one of two copies of the same number.
          node-version-file: next-step-pro-climbing-frontend/.nvmrc
          cache: npm
          cache-dependency-path: next-step-pro-climbing-frontend/package-lock.json

      - run: npm ci

      # Informacyjnie na razie (nie blokuje deployu). Gdy wyniki będą czyste,
      # usuń continue-on-error, żeby high/critical wywalały build.
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      - run: npm run lint

      - run: npx tsc -b

      - run: npm test

      # Second pass under a negative UTC offset. Every timezone bug the calendar has had was
      # invisible in Poland and total for an athlete abroad (a "next week" arrow that wrote
      # back the date already in the URL, a completion button eight hours off), and a runner
      # in UTC is not far enough west to catch them either.
      - name: Unit tests (America/New_York)
        run: npm run test:tz

      # E2E lived in the repo but ran only when someone remembered to, so it was free to rot.
      # The golden path is deliberately backend-free and playwright.config.ts brings up the dev
      # server itself, so this needs nothing beyond the browser binary.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: next-step-pro-climbing-frontend/test-results/
          retention-days: 7

      - run: npm run build

  docker:
    needs: lint-typecheck-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextsteppro-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: next-step-pro-climbing-frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skan CVE obrazu — warstwa systemowa nginxa, czego npm audit nie widzi. ignore-unfixed
      # ucina szum z podatności bez łatki; zostają te naprawialne bumpem bazy. Skanuje manifest
      # amd64 (warstwa OS wspólna dla obu architektur).
      # Wynik idzie do zakładki Security, nie tylko do logu. ⚠️ To nie jest kosmetyka:
      # po stronie backendu ten sam skan zgłaszał 3× CRITICAL i nikt tego nie widział, bo przy
      # format: table i exit-code: 0 raport oglądał wyłącznie ten, kto otworzył log builda
      # zakończonego na zielono. Czyli nikt. SARIF wgrany tutaj daje alerty w miejscu, do
      # którego GitHub sam kieruje.
      - name: Trivy image scan (SARIF do zakładki Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/nextstepprodev/nextsteppro-frontend:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Ten przebieg tylko raportuje; bramką jest krok poniżej.
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Wgraj wynik do zakładki Security
        uses: github/codeql-action/upload-sarif@v4
        # Wgraj także wtedy, gdy bramka niżej wywali build — inaczej dokładnie w sytuacji,
        # w której raport jest najbardziej potrzebny, nie ma go nigdzie.
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      # Bramka: CRITICAL zatrzymuje build, HIGH tylko raportuje.
      # ⚠️ Próg jest na CRITICAL, a nie na HIGH, i to jest przemyślane: warstwa systemowa alpine
      # ma stale kilka HIGH bez związku z naszym kodem (curl, openssl), więc bramka na HIGH
      # blokowałaby deploy w rytmie wydań Alpine'a i szybko zostałaby wyłączona. CRITICAL jest
      # dziś czyste — po naprawie tomcata app.jar zgłasza zero — więc ta bramka od pierwszego
      # dnia znaczy "coś się właśnie zepsuło", a nie "znowu to samo".
      - name: Bramka CVE (CRITICAL blokuje)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/nextstepprodev/nextsteppro-frontend:${{ steps.version.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
